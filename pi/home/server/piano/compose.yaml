# Piano tutor songs and the tablet tutor page. Pandora turns YouTube links into MIDI with the transcriber (run on demand),
# and the Tab5 tutor downloads them from the song server on the LAN: http://homepi.local:8095/songs.json
services:
  songs:
    container_name: piano-songs
    image: python:3.11-slim
    restart: unless-stopped
    command: ["python", "-m", "http.server", "8095", "--directory", "/songs"]
    volumes:
      - ./songs:/songs:ro
    ports:
      - "8095:8095"

  # Tutor page for the tablet: http://homepi.local:8096 on the LAN, https://homepi.tail04e168.ts.net:8445
  # on the tailnet (tailscale serve). The keyboard plugs into the tablet and the page drives it with
  # Web MIDI (iPad: open it in the "Web MIDI Browser" app). Symlinks so updated files show up at once.
  tutor:
    container_name: piano-tutor
    image: python:3.11-slim
    restart: unless-stopped
    user: "1000:1000"
    command:
      - sh
      - -c
      - mkdir -p /tmp/www && ln -sf /tutor/index.html /tmp/www/index.html && ln -sfn /songs /tmp/www/songs
        && exec python -m http.server 8096 --directory /tmp/www
    volumes:
      - ./tutor:/tutor:ro
      - ./songs:/songs:ro
    ports:
      - "8096:8096"

  # Not started by `up`; Pandora runs: docker compose run --rm transcriber fetch|convert|register|add-midi|drop ...
  # (see transcribe.py). Audio waiting for conversion lives in ./queue.
  transcriber:
    build: .
    image: piano-transcriber
    profiles: ["tools"]
    # Run as lbx so songs and models stay editable on the Pi; caches go to /tmp
    user: "1000:1000"
    environment:
      HOME: /tmp
      NUMBA_CACHE_DIR: /tmp
      TZ: Europe/Warsaw
    volumes:
      - ./songs:/songs
      - ./queue:/queue
      - ./models:/tmp/piano_transcription_inference_data
    # Leave a core for Home Assistant and the rest
    cpus: 3
